<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Free AI Prompt Tester - Project 2B</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 150px; }
        button { padding: 10px 20px; background: #0070f3; color: white; border: none; cursor: pointer; }
        pre { background: #f5f5f5; padding: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>AI Prompt Tester (Free Demo)</h1>
    <p>Paste a prompt below. This is a client-side demo (no AI call yet - add your own API for full version).</p>
    <textarea id="prompt" placeholder="Enter your prompt here..."></textarea>
    <br><br>
    <button onclick="testPrompt()">Test / Format Prompt</button>
    <h3>Formatted Output:</h3>
    <pre id="output"></pre>
    <script>
        function testPrompt() {
            const p = document.getElementById('prompt').value;
            document.getElementById('output').textContent = "Formatted Prompt:\n\n" + p.trim() + "\n\n---\nReady to copy into Claude/ChatGPT.";
        }
    </script>
    <footer><small>Project 2B - Educational free tool. Upgrade available in full packs.</small></footer>
</body>
</html>
